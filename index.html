    <title>Neo-Brutalist Reasoner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Work Sans"', 'sans-serif'],
              mono: ['"Space Mono"', 'monospace'],
            },
            colors: {
              'neo-bg': '#f0f0eb',
              'neo-yellow': '#ffde00',
              'neo-pink': '#ff90e8',
              'neo-blue': '#23a6d5',
              'neo-green': '#39ff14',
            },
            boxShadow: {
              'neo': '5px 5px 0px 0px rgba(0,0,0,1)',
              'neo-sm': '3px 3px 0px 0px rgba(0,0,0,1)',
              'neo-hover': '2px 2px 0px 0px rgba(0,0,0,1)',

          }
        }

    <style>
      body {
        background-color: #f0f0eb;

      ::-webkit-scrollbar-track {

      }
      ::-webkit-scrollbar-thumb {
        background: #000;
        border: 2px solid white;
      }
      ::-webkit-scrollbar-thumb:hover {
